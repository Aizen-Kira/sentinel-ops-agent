[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelmcp"
version = "1.1.0"
description = "AI-powered DFIR triage agent using FastMCP and Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SentinelMCP Team" }]

dependencies = [
    "fastmcp>=2.0.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.9.0",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
sentinelmcp = "agent.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server", "shared", "benchmark", "realtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
